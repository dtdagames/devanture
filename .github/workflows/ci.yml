name: Compilateur
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    name: Exemples compilés, bancs HTTP, atelier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          tools: none
      - run: npm ci
      - name: Atelier navigateur (requis par les sites qui l'embarquent, site.studio.enabled)
        run: node scripts/build-studio.mjs
      - name: Vérifier et compiler les exemples
        run: bash scripts/ci-examples.sh
      - name: Syntaxe du PHP produit
        run: find examples/savonnerie/dist examples/plomberie-martin/dist -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Banc boutique (parcours d'achat, stock, webhook)
        env: { PHP_BIN: php }
        run: bash scripts/ci-run.sh "banc boutique" node scripts/verify-shop.mjs examples/savonnerie/dist 8970
      - name: Banc site (routes, SEO, formulaires, sécurité)
        env: { PHP_BIN: php }
        run: |
          bash scripts/ci-run.sh "banc site savonnerie" node scripts/verify-php-site.mjs examples/savonnerie/dist 8971
          bash scripts/ci-run.sh "banc site plomberie" node scripts/verify-php-site.mjs examples/plomberie-martin/dist 8972
      - name: Banc du langage (expressions JS = PHP, gabarits, collections, composition, composant de projet)
        env: { PHP_BIN: php }
        run: bash scripts/ci-run.sh "banc langage" node scripts/verify-lang.mjs examples/plomberie-martin/dist 8973
      - name: Outils du langage (paquets de composants, sitec test, sitec migrate)
        env: { PHP_BIN: php }
        run: bash scripts/ci-run.sh "outils du langage" node scripts/verify-lang-tools.mjs
      - name: Banc des expériences (tirage, exposition, objectif, verdicts, avec des visiteurs simulés)
        env: { PHP_BIN: php }
        run: bash scripts/ci-run.sh "banc expériences" node scripts/verify-experiments.mjs examples/plomberie-martin/dist 8974
      - name: Banc des registres (places limitées, unicité, liste d'attente, back-office, envois simultanés)
        env: { PHP_BIN: php }
        run: bash scripts/ci-run.sh "banc registres" node scripts/verify-registre.mjs examples/le-fournil/dist 8975
      - name: Banc du format document (document.md lu sans modèle, lecture figée, trois garde-fous)
        env: { PHP_BIN: php }
        run: bash scripts/ci-run.sh "banc document" node scripts/verify-document.mjs
      - name: Banc du site écrit en documents (site.md et pages/<id>.md lus sans modèle, même site qu'en YAML, lecture figée)
        env: { PHP_BIN: php }
        run: bash scripts/ci-run.sh "banc document du site" node scripts/verify-site-document.mjs
      - name: Banc de la documentation (exemples compilés, commandes, options et listes comparées au compilateur)
        run: bash scripts/ci-run.sh "banc documentation" node scripts/verify-docs.mjs
      - name: Dépôt de site (sitec init) et compilation dans l'atelier
        run: |
          bash scripts/ci-run.sh "sitec init" node bin/sitec.js init /tmp/site-test --name "Site de test" --no-git --local
          bash scripts/ci-run.sh "check du site créé" node bin/sitec.js check /tmp/site-test
          bash scripts/ci-run.sh "compilation dans l'atelier" node scripts/ci-studio.mjs

  apache:
    name: Sites compilés sous Apache (php:8.3-apache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Atelier navigateur (requis par la savonnerie, site.studio.enabled)
        run: node scripts/build-studio.mjs
      - name: Compiler les sites et l'hôte
        run: |
          node bin/sitec.js build examples/savonnerie
          node bin/sitec.js build examples/plomberie-martin
          node bin/sitec.js build examples/garnier-associes
          node bin/sitec.js build examples/le-fournil
          node bin/sitec.js host examples/hote
      - name: Image Apache
        run: docker pull -q php:8.3-apache
      - name: Site seul sous Apache (cache statique, .htaccess, déploiement, bancs)
        run: |
          bash scripts/ci-run.sh "apache savonnerie" node scripts/verify-apache.mjs examples/savonnerie/dist 8085
          bash scripts/ci-run.sh "apache plomberie" node scripts/verify-apache.mjs examples/plomberie-martin/dist 8086
          bash scripts/ci-run.sh "apache garnier (paquet de composants)" node scripts/verify-apache.mjs examples/garnier-associes/dist 8089
          bash scripts/ci-run.sh "apache fournil (registre à règles, envois simultanés)" node scripts/verify-apache.mjs examples/le-fournil/dist 8090
      - name: Hôte multi-sites sous Apache (un domaine à la fois)
        run: |
          bash scripts/ci-run.sh "apache hôte savonnerie" node scripts/verify-apache.mjs examples/hote/dist 8087 --host savonnerie-du-port.fr
          bash scripts/ci-run.sh "apache hôte plomberie" node scripts/verify-apache.mjs examples/hote/dist 8088 --host www.plomberie-martin.fr
