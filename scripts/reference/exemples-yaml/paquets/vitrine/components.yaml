components:
  contact-rapide:
    description: "Un encart puis un bandeau d'appel : le téléphone et l'adresse viennent de site.contact."
    params:
      titre: { type: string, required: true, description: titre de l'encart }
      texte: { type: string, default: "", description: phrase sous le titre }
      bouton: { type: link, default: { label: Nous écrire, to: /contact }, description: bouton du bandeau }
    sections:
      - vitrine.encart:
          tone: succes
          icon: phone
          title: "{{ p.titre }}"
          text: "{{ p.texte }}"
      - cta:
          title: "Appelez le {{ site.contact.phone }}"
          text: "{{ site.contact.address }}"
          style: surface
          button: "{{ p.bouton }}"
