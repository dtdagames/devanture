<section class="section encart-wrap">
  <div class="container">
    <aside class="encart encart-{{ p.tone | default('info') }}">
      <div class="encart-icon" aria-hidden="true">{{ icon(p.icon | default('check')) }}</div>
      <div class="encart-body">
        <h2 class="encart-title">{{ p.title }}</h2>
        {% if p.text %}<p>{{ markup(p.text) }}</p>{% endif %}
        {% if p.link %}{{ link(p.link, 'encart-link') }}{% endif %}
      </div>
    </aside>
  </div>
</section>
