# Composants composés : des assemblages nommés de composants existants, avec des paramètres.
# Usage dans une page : - offre: { titre: Dépannage, prix: 95 € TTC, points: [Déplacement compris, Devis avant travaux] }
components:
  offre:
    description: "Une offre tarifaire : son prix, puis ses points forts en trois colonnes, et un bouton."
    params:
      titre: { type: string, required: true, description: nom de l'offre }
      prix: { type: string, required: true, description: "prix affiché, texte libre (95 € TTC, sur devis)" }
      detail: { type: string, default: "", description: phrase sous le prix }
      points: { type: list, default: [], description: liste de points forts (textes) }
      cta: { type: link, default: { label: Nous contacter, to: /contact }, description: bouton sous les points }
    sections:
      - pricelist:
          title: "{{ p.titre }}"
          groups:
            - items:
                - { name: "{{ p.titre }}", price: "{{ p.prix }}", description: "{{ p.detail }}" }
      - features:
          columns: 3
          items: { for: p.points, as: pt, item: { icon: check, title: "{{ pt }}" } }
      - cta:
          title: "{{ p.titre }} : parlons-en"
          style: surface
          button: "{{ p.cta }}"
