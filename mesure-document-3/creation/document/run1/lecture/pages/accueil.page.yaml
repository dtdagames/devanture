route: /
seo:
  title: Cabinet Garnier & Associés, avocats à Bordeaux
  description: Avocats en droit du travail, des affaires et de la famille à Bordeaux, Libourne et Arcachon.
sections:
  - hero:
      title: Des avocats à vos côtés à Bordeaux
      subtitle: Droit du travail, droit des affaires, droit de la famille. Première consultation de 30 minutes offerte.
      image: hero.svg
      cta:
        label: Prendre rendez-vous
        to: /contact
      secondary:
        label: Nos domaines
        to: /domaines
  - features:
      title: Nos trois domaines
      columns: 3
      items:
        - icon: users
          title: Droit du travail
          text: Me Hélène Garnier
        - icon: scale
          title: Droit des affaires
          text: Me Thomas Ruiz
        - icon: home
          title: Droit de la famille
          text: Me Inès Kaddour
  - stats:
      items:
        - value: "2011"
          label: année de fondation du cabinet
        - value: "3"
          label: associés
        - value: 30 min
          label: de première consultation offerte
  - richtext:
      title: Un cabinet à taille humaine
      text: |-
        Fondé en 2011 à Bordeaux, le cabinet Garnier & Associés réunit trois associés, deux collaboratrices et une assistante.

        Nous intervenons à Bordeaux, Libourne et Arcachon, en conseil comme en contentieux, avec une convention d'honoraires systématique.
      image: cabinet.svg
  - cta:
      title: Parlons de votre situation
      text: La première consultation de 30 minutes est offerte.
      button:
        label: Nous contacter
        to: /contact
