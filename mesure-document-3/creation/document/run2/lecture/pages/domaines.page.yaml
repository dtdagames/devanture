# Lecture de ce document par sitec : le YAML que ce document vaut.
# Ne modifiez pas ce fichier : corrigez le document, relisez « sitec lire <dossier> », puis acceptez (« --accepter »).
route: /domaines
seo:
  title: Domaines d'intervention
  description: "Droit du travail, droit des affaires et droit de la famille : les trois domaines du cabinet."
sections:
  - hero:
      title: Nos domaines d'intervention
      subtitle: Trois associés, trois spécialités, un même cabinet à Bordeaux.
      cta:
        label: Nous contacter
        to: /contact
  - features:
      title: Trois spécialités
      items:
        - icon: scale
          title: Droit du travail
          text: Me Hélène Garnier conseille et défend les parties dans leurs litiges de travail. Elle intervient à Bordeaux, Libourne et Arcachon.
        - icon: euro
          title: Droit des affaires
          text: Me Thomas Ruiz accompagne les entreprises dans leurs décisions juridiques. Il intervient à Bordeaux, Libourne et Arcachon.
        - icon: heart
          title: Droit de la famille
          text: Me Inès Kaddour accompagne les familles dans leurs démarches. Elle intervient à Bordeaux, Libourne et Arcachon.
  - steps:
      title: Comment se déroule un dossier
      items:
        - title: Premier rendez-vous
          text: Une consultation de 30 minutes, offerte, pour faire le point sur votre situation.
        - title: Convention d'honoraires
          text: Une convention d'honoraires est systématiquement établie avant toute démarche.
        - title: Traitement du dossier
          text: L'avocat en charge instruit votre dossier et vous conseille.
        - title: Suivi
          text: Vous restez informé de l'avancement de votre dossier.
  - faq:
      title: Questions fréquentes
      items:
        - q: La première consultation est-elle payante ?
          a: Non, la première consultation de 30 minutes est offerte.
        - q: Comment sont fixés les honoraires ?
          a: Au forfait ou au temps passé, avec une convention d'honoraires systématique.
        - q: Où intervenez-vous ?
          a: À Bordeaux, Libourne et Arcachon.
  - cta:
      title: Parlons de votre dossier
      text: Première consultation de 30 minutes offerte.
      button:
        label: Prendre rendez-vous
        to: /contact
