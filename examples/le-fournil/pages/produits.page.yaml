  - faq:
      title: Questions sur nos produits
      items:
        - q: Vos pains contiennent-ils des additifs ?
          a: Non. Nos pains sont composés de farine, d'eau, de sel et de levain naturel. Aucun améliorant, aucun conservateur. La baguette tradition respecte le décret de 1993 qui l'encadre.
        - q: Proposez-vous des produits sans gluten ?
          a: "Nous ne fabriquons pas de produits sans gluten : notre fournil travaille le blé en permanence et nous ne pouvons pas garantir l'absence de traces."
        - q: Quelle est la liste des allergènes ?
          a: La liste des allergènes de chaque produit est affichée en boutique et disponible sur demande au comptoir. N'hésitez pas à nous interroger.
        - q: Faites-vous des pains spéciaux sur commande ?
          a: Oui. Pour un pain de 2 kg, une tourte à partager ou une quantité importante, commandez la veille avant 17 h par téléphone ou en boutique.
  - cta:
      title: Une commande pour un événement ?
      text: Buffets, pièces montées, plateaux de mini-viennoiseries. Nous préparons vos commandes à partir de 10 personnes.
      button: { label: Voir les commandes événements, to: /commandes-evenements }
      style: surface
