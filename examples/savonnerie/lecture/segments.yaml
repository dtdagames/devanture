# Lecture de segments.md par sitec : le YAML que ce document vaut.
# Ne modifiez pas ce fichier : corrigez le document, relisez « sitec lire <dossier> », puis acceptez (« --accepter »).
segments:
  panier_abandonne:
    all:
      - event: cart_add
        within: 7d
      - not:
          event: purchase
          within: 7d
  recurrent:
    visits:
      gte: 2
  nouveau:
    visits: 1
priority:
  - panier_abandonne
  - recurrent
  - nouveau
