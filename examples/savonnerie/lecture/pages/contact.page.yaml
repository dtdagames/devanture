# Lecture de ce document par sitec : le YAML que ce document vaut.
# Ne modifiez pas ce fichier : corrigez le document, relisez « sitec lire <dossier> », puis acceptez (« --accepter »).
route: /contact
seo:
  title: Contact · Maison Dubois
  description: Une question, une commande spéciale, un atelier de groupe ? Écrivez-nous.
sections:
  - contact.form:
      title: Écrivez-nous
      to: bonjour@maison-dubois.fr
      fields:
        - name
        - email
        - subject
        - message
      success: Merci, nous vous répondons sous 24 h.
