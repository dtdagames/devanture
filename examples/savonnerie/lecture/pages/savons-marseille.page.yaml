append:
  - faq:
      title: Le savon de Marseille en trois questions
      items:
        - q: Qu'est-ce qu'un vrai savon de Marseille ?
          a: Un savon composé d'au moins 72 % d'huile végétale, sans graisse animale, sans parfum ni colorant. Le nôtre est à l'huile d'olive.
        - q: Pourquoi la saponification à froid ?
          a: Les huiles ne sont pas chauffées au-delà de 40 °C, ce qui conserve la glycérine naturelle et les propriétés des huiles.
        - q: Peut-on s'en servir pour la lessive ?
          a: Oui, râpé, à raison de 30 g par litre d'eau chaude. C'est l'usage historique du savon de Marseille.
