# Lecture de ce document par sitec : le YAML que ce document vaut.
# Ne modifiez pas ce fichier : corrigez le document, relisez « sitec lire <dossier> », puis acceptez (« --accepter »).
route: /
seo:
  title: Maison Dubois · Savonnerie artisanale à Marseille
  description: Savons et cosmétiques solides saponifiés à froid à Marseille depuis 1987. Boutique en ligne, livraison offerte dès 50 €.
sections:
  - hero:
      title: Des savons faits main à Marseille
      subtitle: Saponification à froid, huiles bio et locales, séchage de quatre semaines. Depuis 1987.
      image: hero.svg
      cta:
        label: Découvrir la boutique
        to: /boutique
      secondary:
        label: Visiter l'atelier
        to: /atelier
      id: accueil-hero
      variants:
        panier_abandonne:
          title: Votre panier vous attend
          subtitle: Vos savons sont toujours réservés. Finalisez votre commande en deux minutes, livraison offerte dès 50 €.
          cta:
            label: Reprendre mon panier
            to: /panier
  - recent:
      title: Reprendre où vous en étiez
      limit: 4
      id: reprise
  - features:
      title: Pourquoi nos savons
      items:
        - icon: leaf
          title: 100 % naturel
          text: Huiles végétales bio, huiles essentielles, aucun parfum de synthèse.
        - icon: heart
          title: Fait main
          text: Chaque pain est coupé et estampillé à la main dans notre atelier.
        - icon: truck
          title: Livraison offerte dès 50 €
          text: Expédition sous 48 h en colis recyclé, ou retrait gratuit à l'atelier.
      id: pourquoi
  - products.grid:
      title: Nos best-sellers
      filter:
        featured: true
      columns: 4
      cta:
        label: Toute la boutique
        to: /boutique
      id: best-sellers
  - testimonials:
      title: Ils en parlent
      items:
        - quote: Le savon lavande a réconcilié ma peau avec les savons. Je ne commande plus que là.
          author: Hélène M.
          role: Aix-en-Provence
          rating: 5
        - quote: Shampoing solide adopté par toute la famille. Livraison rapide et emballage soigné.
          author: Thomas R.
          role: Lyon
          rating: 5
      id: avis
  - cta:
      title: Une question sur un produit ?
      text: Nous répondons sous 24 h, et l'atelier est ouvert du mardi au samedi.
      button:
        label: Nous écrire
        to: /contact
      id: contact-cta
variants:
  panier_abandonne:
    first:
      - accueil-hero
      - reprise
      - best-sellers
    hide:
      - avis
  recurrent:
    first:
      - accueil-hero
      - reprise
