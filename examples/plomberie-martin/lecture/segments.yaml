# Lecture de segments.md par sitec : le YAML que ce document vaut.
# Ne modifiez pas ce fichier : corrigez le document, relisez « sitec lire <dossier> », puis acceptez (« --accepter »).
segments:
  nouveau:
    visits: 1
  recurrent:
    visits:
      gte: 2
  devis_abandonne:
    all:
      - event: form_start
        within: 7d
      - not:
          event: form_submit
          within: 7d
  fan_services:
    event: section_view
    where:
      section: services
    count:
      gte: 2
  mobile:
    device: mobile
priority:
  - devis_abandonne
  - prix_annonce
  - fan_services
  - recurrent
  - nouveau
  - mobile
goals:
  appel:
    event: click_cta
    where:
      to: tel:0472001122
  devis:
    event: form_sent
    where:
      form: contact
experiments:
  accroche:
    goal: appel
    arms:
      - prix_annonce
  relance:
    goal: devis
    segment: devis_abandonne
    holdout: 20
