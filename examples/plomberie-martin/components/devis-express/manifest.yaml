name: devis-express
description: "Demande de devis en trois champs, enregistrée dans la collection devis et transmise par e-mail. Composant propre au site."
données:
  title: texte — titre du bloc
  intro: texte, facultatif — phrase sous le titre
  delai: texte, facultatif — délai de réponse annoncé (ex. 2 h ouvrées)
forme:
  section, conteneur « devis-express-inner »:
    - bloc « devis-express-text »:
        - titre: title
        - texte: intro
        - texte discret: "Réponse sous {{ delai }}, du lundi au samedi. Ou appelez le [{{ site.contact.phone }}](tel:{{ site.contact.phone | replace(' ', '') }})."
    - formulaire, bouton Demander un devis:
        - champ: name
        - champ: phone
        - champ: type_travaux
        - champ: details
apparence:
  section: fond surface
  devis-express-inner: deux colonnes
  sur téléphone:
    devis-express-inner: une colonne
effects:
  form:
    store: devis
    notify: true
    success: Merci, un plombier vous rappelle pour chiffrer votre demande.
    fields:
      - name
      - phone
      - { name: type_travaux, label: Type de travaux, type: select, options: [Fuite ou dépannage, Chauffe-eau, Chaudière ou chauffage, Salle de bain, Autre], required: true }
      - { name: details, label: Précisions, type: textarea, placeholder: "Étage, accès, urgence…" }
example: |
  - devis-express:
      title: Un devis en quelques minutes
      intro: Dites-nous ce qui ne va pas, nous rappelons avec un prix.
      delai: 2 h ouvrées
intents: [devis, demander un prix, estimation, rappel]
