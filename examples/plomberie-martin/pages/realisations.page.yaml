      keywords: [ photos salle de bain, douche italienne, chaudière à condensation, chauffe-eau thermodynamique, wc suspendu, cuisine, rénovation complète, chantier récent, voir des exemples ]
  - collection.list:
      id: salles-de-bain
      source: realisations
      title: Salles de bain
      filter: { category: salle-de-bain }
      columns: 3
  - cta:
      title: Votre projet mérite le même soin
      button: { label: Parlons-en, to: /contact }
      keywords: [ lancer mon projet, discuter de mon projet, me faire conseiller, étude de projet ]
