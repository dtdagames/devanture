page: realisations
route: /realisations
seo:
  title: Réalisations · Plomberie Martin
  description: Quelques chantiers récents à Lyon et dans la métropole.
sections:
  - hero:
      title: Nos réalisations
      subtitle: Un aperçu de chantiers récents, du dépannage à la rénovation complète.
      keywords: [ exemples de chantiers, travaux réalisés, avant après, nos chantiers, références ]
  - collection.list:
