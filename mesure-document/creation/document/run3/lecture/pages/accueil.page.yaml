# Lecture de ce document par sitec : le YAML que ce document vaut.
# Ne modifiez pas ce fichier : corrigez le document, relisez « sitec lire <dossier> », puis acceptez (« --accepter »).
route: /
seo:
  title: Cabinet Garnier & Associés, avocats à Bordeaux
  description: Avocats en droit du travail, des affaires et de la famille à Bordeaux, Libourne et Arcachon.
sections:
  - hero:
      title: Des avocats à vos côtés à Bordeaux
      subtitle: "Droit du travail, droit des affaires, droit de la famille : trois associés, une même exigence."
      image: cabinet.svg
      cta:
        label: Prendre rendez-vous
        to: /contact
      secondary:
        label: Nos honoraires
        to: /honoraires
  - features:
      title: Ce que vous pouvez attendre du cabinet
      columns: 3
      items:
        - icon: scale
          title: Trois domaines
          text: Travail, affaires et famille, portés chacun par un associé.
        - icon: euro
          title: Honoraires transparents
          text: Forfait ou temps passé, avec une convention d'honoraires systématique.
        - icon: phone
          title: Première consultation offerte
          text: 30 minutes pour exposer votre situation.
  - stats:
      items:
        - value: "2011"
          label: année de fondation
        - value: "3"
          label: associés
        - value: "3"
          label: "villes d'intervention : Bordeaux, Libourne, Arcachon"
  - steps:
      title: Comment se déroule une collaboration
      items:
        - title: Première consultation
          text: 30 minutes offertes pour exposer votre situation.
        - title: Convention d'honoraires
          text: Les honoraires sont fixés par écrit, au forfait ou au temps passé.
        - title: Suivi du dossier
          text: Nous vous tenons informé à chaque étape.
  - cta:
      title: Une question juridique ?
      text: Contactez-nous pour fixer une première consultation.
      button:
        label: Nous écrire
        to: /contact
