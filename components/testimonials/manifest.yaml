name: testimonials
order: 50
description: Témoignages clients (citation, auteur, rôle ou ville, note optionnelle).
données:
  title: texte, facultatif
  items (liste, au moins 1):
    quote: texte
    author: texte
    role: texte, facultatif — fonction, entreprise ou ville
    rating: nombre entier, de 1 à 5, facultatif — note sur 5
forme:
  - en-tête: title
  - grille de items, 3 colonnes:
      - témoignage « testimonial »:
          - étoiles: rating
          - citation: quote
          - signature: author, role
example: |
  - testimonials:
      title: Ils nous font confiance
      items:
        - { quote: Travail soigné et dans les délais., author: Marie L., role: Lyon, rating: 5 }
        - { quote: Équipe à l'écoute., author: Karim B., role: Villeurbanne }
intents: [avis, témoignages, clients, note]
