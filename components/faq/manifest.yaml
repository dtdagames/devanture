name: faq
order: 60
description: Questions fréquentes en accordéon (question, réponse).
props:
  type: object
  required: [items]
  properties:
    title: { type: string }
    intro: { type: string }
    items:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required: [q, a]
        properties:
          q: { type: string, description: question }
          a: { type: string, description: réponse (paragraphes séparés par une ligne vide) }
example: |
  - faq:
      title: Questions fréquentes
      items:
        - { q: Livrez-vous partout en France ?, a: "Oui, sous 48 h ouvrées." }
        - q: Puis-je retourner un produit ?
          a: Vous avez 14 jours pour changer d'avis.
intents: [questions, faq, comment, est-ce que]
