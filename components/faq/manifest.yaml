name: faq
order: 60
description: Questions fréquentes en accordéon (question, réponse).
données:
  title: texte, facultatif
  intro: texte, facultatif
  items (liste, au moins 1):
    q: texte — question
    a: texte — réponse (paragraphes séparés par une ligne vide)
forme:
  section, conteneur « faq-inner »:
    - en-tête: title, intro
    - accordéon de items, question q, réponse a
example: |
  - faq:
      title: Questions fréquentes
      items:
        - { q: Livrez-vous partout en France ?, a: "Oui, sous 48 h ouvrées." }
        - q: Puis-je retourner un produit ?
          a: Vous avez 14 jours pour changer d'avis.
intents: [questions, faq, comment, est-ce que]
