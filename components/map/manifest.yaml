name: map
order: 94
description: "Carte et accès : adresse, boutons d'itinéraire, et carte OpenStreetMap chargée au clic (aucun appel tiers avant l'accord du visiteur) si lat et lon sont fournis."
props:
  type: object
  properties:
    title: { type: string, description: défaut « Nous trouver » }
    address: { type: string, description: défaut l'adresse du site }
    lat: { type: number, description: latitude (ex. 45.7772) }
    lon: { type: number, description: longitude (ex. 4.8319) }
    zoom: { type: integer, minimum: 10, maximum: 19, description: défaut 16 }
    access: { type: string, description: "indications d'accès (métro, parking, étage), paragraphes séparés par une ligne vide" }
example: |
  - map:
      title: Nous trouver
      lat: 45.7772
      lon: 4.8319
      access: |
        Métro C, arrêt Croix-Rousse, puis 3 minutes à pied.

        Stationnement : parking Gros Caillou (payant).
intents: [adresse, où, plan, carte, itinéraire, venir, accès, parking, métro]
