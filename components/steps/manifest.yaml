  - liste numérotée « steps-list » de items:
      - élément « step »:
          - numéro « step-num »
          - bloc:
              - titre: title
              - texte discret: text
example: |
  - steps:
      title: Comment ça se passe
      items:
        - { title: Premier échange, text: 30 minutes offertes pour comprendre votre situation. }
        - { title: Convention d'honoraires, text: Un devis écrit avant toute démarche. }
        - { title: Suivi, text: Un interlocuteur unique jusqu'à la fin du dossier. }
intents: [étapes, comment ça se passe, déroulement, processus, procédure]
