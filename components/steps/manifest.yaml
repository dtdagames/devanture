name: steps
order: 98
description: "Étapes numérotées (déroulé d'un dossier, d'une prestation, d'une commande)."
données:
  title: texte, facultatif
  intro: texte, facultatif
  items (liste, au moins 2):
    title: texte
    text: texte, facultatif
forme:
