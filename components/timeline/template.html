<section class="section timeline">
  <div class="container timeline-inner">
    {% if p.title or p.intro %}
    <div class="section-head">
      {% if p.title %}<h2>{{ p.title }}</h2>{% endif %}
      {% if p.intro %}<p>{{ p.intro }}</p>{% endif %}
    </div>
    {% endif %}
    <ol class="timeline-list">
      {% for it in p.items %}
      <li class="tl-item"><time class="tl-date">{{ it.date }}</time><div class="tl-body"><h3>{{ it.title }}</h3>{% if it.text %}<p class="muted">{{ it.text }}</p>{% endif %}</div></li>
      {% endfor %}
    </ol>
  </div>
</section>
