name: timeline
order: 99
description: "Frise chronologique : dates clés avec titre et texte (histoire d'une entreprise, parcours)."
données:
  title: texte, facultatif
  intro: texte, facultatif
  items (liste, au moins 2):
    date: texte ou nombre — année ou date affichée (ex. 1987, « mars 2015 »)
    title: texte
    text: texte, facultatif
forme:
  section, conteneur « timeline-inner »:
    - en-tête: title, intro
    - liste numérotée « timeline-list » de items:
        - élément « tl-item »:
            - date « tl-date »: date
            - bloc « tl-body »:
                - titre: title
                - texte discret: text
example: |
  - timeline:
      title: Notre histoire
      items:
        - { date: 1987, title: Ouverture de l'atelier, text: Jeanne Dubois s'installe rue des Lilas. }
        - { date: 2015, title: Camille reprend, text: Les cosmétiques solides rejoignent la gamme. }
intents: [histoire, dates, chronologie, depuis quand, parcours]
