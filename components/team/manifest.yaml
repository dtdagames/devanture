name: team
order: 80
description: Présentation de l'équipe (photo, nom, rôle, courte bio).
données:
  title: texte, facultatif
  intro: texte, facultatif
  members (liste, au moins 1):
    name: texte
    role: texte, facultatif
    photo: image, facultatif
    bio: texte, facultatif
forme:
  - en-tête: title, intro
  - grille de members, 4 colonnes:
      - bloc « team-member »:
          - portrait « team-avatar »: photo, name
          - titre: name
          - bloc « muted »: role
          - texte: bio
example: |
  - team:
      title: L'équipe
      members:
        - { name: Jeanne Dubois, role: Fondatrice, photo: jeanne.jpg }
        - { name: Paul Martin, role: Maître savonnier, bio: 15 ans de métier }
intents: [équipe, qui, membres, associés, personnel]
