name: products.grid
order: 110
description: "Grille de produits depuis data/products.yaml : image, nom, prix, badge, bouton d'ajout au panier et lien vers la fiche. Filtre par catégorie ou mis en avant."
props:
  type: object
  properties:
    title: { type: string }
    intro: { type: string }
    filter:
      type: object
      additionalProperties: false
      properties:
        category: { type: string, description: "catégorie telle qu'écrite dans products.yaml" }
        featured: { type: boolean, description: "true = seulement les produits featured: true" }
    sort: { type: string, enum: [name, price, price_desc], description: ordre d'affichage (défaut ordre du fichier) }
    limit: { type: integer, minimum: 1 }
    columns: { type: integer, enum: [2, 3, 4], description: défaut 3 }
    show_add: { type: boolean, default: true, description: "bouton « Ajouter au panier » (défaut true)" }
    cta: { $ref: "#/$defs/link", description: lien sous la grille (ex. vers la boutique complète) }
# Ce que le composant lit à chaque visite : les produits de la sélection, avec leur stock du moment.
fonctionnement:
  lit:
    produits: produits de la boutique, catégorie filter.category, vedettes filter.featured, tri sort, limite limit
forme:
  section « products »:
    - en-tête: title, intro
    - si produits:
        - grille « products-grid » de produits, colonnes columns par défaut 3:
            - carte de produit: valeur, show_add
    - sinon:
        - texte discret: « Aucun produit dans cette sélection pour le moment. »
    - si cta:
        - bloc « products-cta »:
            - bouton discret: cta
example: |
  - products.grid:
      title: Nos savons
      filter: { category: savons }
      columns: 3
      cta: { label: Toute la boutique, to: /boutique }
intents: [boutique, acheter, produits, commander, catalogue, articles]
