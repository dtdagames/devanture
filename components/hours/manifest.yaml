name: hours
order: 95
description: "Horaires d'ouverture par jour, avec l'état « ouvert / fermé actuellement » calculé côté serveur et le jour courant mis en avant."
props:
  type: object
  required: [days]
  properties:
    title: { type: string, description: titre (défaut Horaires d'ouverture) }
    intro: { type: string }
    note: { type: string, description: "mention sous le tableau (ex. Fermé les jours fériés)" }
    timezone: { type: string, description: fuseau pour le calcul de l'état (défaut Europe/Paris) }
    show_status: { type: boolean, description: "afficher « Ouvert actuellement » / « Fermé » (défaut true)" }
    days:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required: [day]
        properties:
          day: { type: string, enum: [lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche] }
          slots:
            type: array
            minItems: 1
            items: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d-([01]\\d|2[0-3]):[0-5]\\d$" }
            description: "plages HH:MM-HH:MM (ex. 06:30-19:30 ; deux plages pour une coupure)"
          closed: { type: boolean, description: "true = fermé ce jour (sans slots)" }
example: |
  - hours:
      title: Horaires d'ouverture
      note: Fermé les jours fériés.
      days:
        - { day: lundi, closed: true }
        - { day: mardi, slots: ["06:30-19:30"] }
        - { day: mercredi, slots: ["06:30-19:30"] }
        - { day: jeudi, slots: ["06:30-19:30"] }
        - { day: vendredi, slots: ["06:30-19:30"] }
        - { day: samedi, slots: ["06:30-13:00", "15:00-19:30"] }
        - { day: dimanche, slots: ["07:00-13:00"] }
intents: [horaires, ouvert, fermé, heures, ouverture, fermeture, lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche, aujourd'hui]
