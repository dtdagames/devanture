<section class="section stats">
  <div class="container">
    {% if p.title %}<div class="section-head"><h2>{{ p.title }}</h2></div>{% endif %}
    <div class="stats-row">
      {% for s in p.items %}
      <div class="stat"><div class="stat-value">{{ s.value }}</div><div class="stat-label">{{ s.label }}</div></div>
      {% endfor %}
    </div>
  </div>
</section>
