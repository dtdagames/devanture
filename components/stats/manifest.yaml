name: stats
order: 90
description: "Chiffres clés en ligne (valeur, libellé). Exemple : 25 ans d'expérience, 300 chantiers."
données:
  title: texte, facultatif
  items (liste, au moins 2):
    value: 'texte ou nombre — le chiffre tel qu''affiché (ex : 25+, 98 %). Entre guillemets si décimal ("4,9").'
    label: texte
forme:
  - en-tête: title
  - rangée « stats-row » de items:
      - bloc « stat »:
          - bloc « stat-value »: value
          - bloc « stat-label »: label
example: |
  - stats:
      items:
        - { value: 25 ans, label: d'expérience }
        - { value: 300+, label: chantiers réalisés }
        - { value: 98 %, label: de clients satisfaits }
intents: [chiffres, expérience, depuis quand]
