<section class="section richtext">
  <div class="container{% if p.image %} richtext-split richtext-img-{{ p.image_position | default('right') }}{% else %} richtext-narrow{% endif %}">
    <div class="richtext-body">
      {% if p.title %}<h2>{{ p.title }}</h2>{% endif %}
      {{ paragraphs(p.text) }}
      {% if p.cta %}{{ link(p.cta, 'btn') }}{% endif %}
    </div>
    {% if p.image %}<div class="richtext-media">{{ img(p.image, p.title | default(''), '(max-width: 700px) 100vw, 50vw') }}</div>{% endif %}
  </div>
</section>
