{% set align = p.align | default('center') %}
<section class="hero{% if p.image %} hero-img{% endif %} hero-{{ align }}"{% if p.image %} style="--hero-bg:url({{ img_src(p.image, 1600) }})"{% endif %}>
  <div class="container hero-inner">
    <h1>{{ p.title }}</h1>
    {% if p.subtitle %}<p class="hero-sub">{{ p.subtitle }}</p>{% endif %}
    {% if p.cta or p.secondary %}
    <div class="hero-actions">
      {% if p.cta %}{{ link(p.cta, 'btn') }}{% endif %}
      {% if p.secondary %}{{ link(p.secondary, 'btn btn-outline') }}{% endif %}
    </div>
    {% endif %}
  </div>
</section>
