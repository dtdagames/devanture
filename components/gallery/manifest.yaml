name: gallery
order: 40
description: Grille d'images (réalisations, photos, produits) avec légende optionnelle et agrandissement au clic.
données:
  title: texte, facultatif
  intro: texte, facultatif
  columns: nombre entier, facultatif, un parmi 2, 3, 4 — colonnes (défaut 3)
  images (liste, au moins 1):
    src: image
    alt: texte, facultatif — description pour l'accessibilité
    caption: texte, facultatif
forme:
  - en-tête: title, intro
  - grille « gallery-grid » de images, colonnes columns par défaut 3:
      - figure « gallery-item »:
          - image: src, {{ alt | default(caption) | default('') }}, agrandissable
          - légende: caption
example: |
  - gallery:
      title: Nos réalisations
      columns: 3
      images:
        - { src: real-1.jpg, alt: Cuisine rénovée, caption: "Cuisine, Lyon 3e" }
        - { src: real-2.jpg, alt: Salle de bain }
intents: [photos, réalisations, galerie, exemples]
