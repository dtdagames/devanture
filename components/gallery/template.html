{% set cols = p.columns | default(3) %}
<section class="section gallery">
  <div class="container">
    {% if p.title or p.intro %}
    <div class="section-head">
      {% if p.title %}<h2>{{ p.title }}</h2>{% endif %}
      {% if p.intro %}<p>{{ p.intro }}</p>{% endif %}
    </div>
    {% endif %}
    <div class="grid grid-{{ cols }} gallery-grid">
      {% for im in p.images %}
      <figure class="gallery-item">
        <a href="{{ img_src(im.src, 1600) }}" data-lightbox>{{ img(im.src, im.alt | default(im.caption) | default(''), '(max-width: 700px) 100vw, ' ~ ((100 / cols) | round) ~ 'vw') }}</a>
        {% if im.caption %}<figcaption>{{ im.caption }}</figcaption>{% endif %}
      </figure>
      {% endfor %}
    </div>
  </div>
</section>
