page: evenements
route: /commandes-evenements
seo:
  title: Commandes pour événements — Buffets, pièces montées | Le Fournil Nantes
  description: "Pièces montées, buffets de pains et viennoiseries, plateaux de mignardises pour mariages, baptêmes, réunions et réceptions à Nantes. Commande à partir de 10 personnes."
sections:
  - hero:
      title: Commandes pour vos événements
      subtitle: Mariages, baptêmes, anniversaires, petits-déjeuners d'entreprise. Nous préparons des commandes sur mesure à partir de 10 personnes.
      image: piece-montee.svg
      cta: { label: Demander un devis, to: /contact }
      secondary: { label: Appeler le 02 40 00 00 00, to: tel:0240000000 }
  - features:
      title: Ce que nous proposons
      columns: 3
      items:
        - icon: gift
          title: Pièces montées
          text: Choux garnis à la crème pâtissière vanille, caramel ou chocolat, montés en cône ou en présentoir. De 30 à 200 choux.
        - icon: star
          title: Buffets salés
          text: Pains surprise, mini-sandwichs, fougasses garnies, cakes salés et plateaux de pains tranchés assortis.
        - icon: sun
          title: Petits-déjeuners
          text: Plateaux de mini-viennoiseries, brioches, pains au levain tranchés avec beurre et confitures artisanales.
        - icon: heart
          title: Mignardises
          text: Assortiments de tartelettes, financiers, éclairs miniatures et macarons pour le café ou le dessert.
        - icon: check
          title: Gâteaux à partager
          text: Fraisier, tarte XXL, gâteau nantais ou entremets de saison, de 10 à 40 personnes. Inscription sur demande.
        - icon: truck
          title: Livraison sur Nantes
          text: Livraison possible sur Nantes et sa première couronne pour les commandes importantes, ou retrait en boutique.
  - gallery:
      title: Quelques réalisations
      columns: 2
      images:
        - { src: piece-montee.svg, alt: Pièce montée de mariage, caption: Pièce montée de 120 choux pour un mariage à Rezé }
        - { src: buffet.svg, alt: Buffet de mini-viennoiseries, caption: Petit-déjeuner pour 60 personnes dans une entreprise de l'île de Nantes }
  - faq:
      title: Comment ça se passe
      intro: Les réponses aux questions que l'on nous pose le plus souvent.
      items:
        - q: Quel délai pour commander ?
          a: |
            Pour un buffet ou des plateaux de viennoiseries, 72 heures à l'avance. Pour une pièce montée ou un gâteau à partager, une semaine. Pour les mariages, nous conseillons de nous contacter un à deux mois avant la date.
        - q: Y a-t-il un minimum de commande ?
          a: Oui, nos commandes événements commencent à 10 personnes. En dessous, tout est disponible directement en boutique ou sur simple commande la veille.
        - q: Comment obtenir un devis ?
          a: |
            Envoyez-nous le nombre de convives, la date, le type d'événement et vos envies via le formulaire de contact ou par téléphone. Nous vous répondons sous 48 heures avec une proposition chiffrée.

            Un acompte de 30 % est demandé à la confirmation, le solde au retrait ou à la livraison.
        - q: Pouvez-vous tenir compte des allergies ?
          a: Nous adaptons les garnitures et pouvons éviter les fruits à coque sur demande. En revanche, nous ne pouvons pas garantir l'absence de traces de gluten, d'œufs ou de lait, qui sont présents partout dans notre fournil.
        - q: Livrez-vous ?
          a: Pour les commandes importantes, nous livrons sur Nantes et la première couronne (Rezé, Saint-Herblain, Orvault, Sainte-Luce, Vertou), avec un supplément selon la distance. Le retrait en boutique est toujours possible.
  - testimonials:
      title: Ils nous ont fait confiance
      items:
        - quote: Nous avons commandé les petits-déjeuners de notre séminaire pour 45 personnes. Livré à 8 h pile, encore tiède.
          author: Hélène P.
          role: Responsable administrative, Nantes
          rating: 5
        - quote: La pièce montée du baptême a fait le tour de la famille. Anne nous a conseillés sur les quantités, il n'y a pas eu de gâchis.
          author: Karim et Leïla B.
          role: Saint-Herblain
          rating: 5
  - cta:
      title: Parlez-nous de votre événement
      text: Date, nombre de personnes, envies. Nous revenons vers vous sous 48 heures avec un devis.
      button: { label: Demander un devis, to: /contact }
      style: primary
