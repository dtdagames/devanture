page: accueil
route: /
seo:
  title: Boulangerie Le Fournil — Artisan boulanger à Nantes (Bouffay)
  description: "Pain au levain naturel, viennoiseries pur beurre, pâtisseries de saison et sandwichs le midi. Boulangerie artisanale rue de la Juiverie, Nantes. Ouvert du mardi au dimanche."
sections:
  - hero:
      title: Le pain comme on l'aimait, au cœur du Bouffay
      subtitle: Levain naturel, farines de Loire-Atlantique, beurre AOP. Depuis 2009, Anne et Marc Lefèvre cuisent chaque matin dès 4 h.
      image: hero-accueil.svg
      cta: { label: Découvrir nos produits, to: /nos-produits }
      secondary: { label: Commander pour un événement, to: /commandes-evenements }
  - features:
      title: Ce qui sort de notre four
      intro: Tout est pétri, façonné et cuit sur place, rue de la Juiverie. Rien n'arrive surgelé.
      columns: 4
      items:
        - icon: leaf
          title: Pain au levain naturel
          text: Fermentation lente de 18 heures, farines de meunerie régionale, sans additif ni levure ajoutée.
          link: { label: Voir nos pains, to: /nos-produits }
        - icon: sun
          title: Viennoiseries pur beurre
          text: Croissants, pains au chocolat et brioches feuilletés au beurre AOP Charentes-Poitou.
        - icon: gift
          title: Pâtisseries de saison
          text: Tartes aux fruits du moment, flans, Paris-Brest et créations qui changent avec les saisons.
        - icon: clock
          title: Sandwichs le midi
          text: Préparés à partir de 11 h dans nos baguettes et pains spéciaux, garnitures fraîches du jour.
  - stats:
      title: Le Fournil en quelques chiffres
      items:
        - { value: "2009", label: année de création }
        - { value: 5, label: personnes au fournil et en boutique }
        - { value: 18 h, label: de fermentation pour nos pains au levain }
        - { value: 6 jours, label: d'ouverture par semaine }
  - richtext:
      title: Médaille d'argent baguette tradition 2024
      image: tradition.svg
      image_position: left
      text: |
        En 2024, notre baguette tradition a reçu la médaille d'argent du concours départemental de Loire-Atlantique. Une reconnaissance pour un travail quotidien : pointage long, façonnage à la main, cuisson sur sole.

        La tradition du Fournil, c'est une croûte fine et craquante, une mie crème, alvéolée, au goût légèrement noisetté. Elle sort du four en trois fournées, à 6 h 30, 11 h et 16 h 30.
      cta: { label: En savoir plus sur la boulangerie, to: /la-boulangerie }
  - gallery:
      title: Au comptoir cette semaine
      columns: 3
      images:
        - { src: pains.svg, alt: Pains au levain sur la grille, caption: Pains au levain du matin }
        - { src: viennoiseries.svg, alt: Croissants et pains au chocolat, caption: Viennoiseries pur beurre }
        - { src: patisseries.svg, alt: Pâtisseries de saison, caption: Pâtisseries de saison }
  - testimonials:
      title: Ce que disent nos clients
      items:
        - quote: Le pain au levain se garde quatre jours sans problème. On n'achète plus ailleurs depuis qu'on habite le quartier.
          author: Claire D.
          role: Nantes, Bouffay
          rating: 5
        - quote: La tradition est vraiment au niveau de sa médaille. Et les croissants du dimanche, une habitude familiale.
          author: Julien M.
          role: Nantes, Decré
          rating: 5
        - quote: Ils ont fait la pièce montée de notre mariage pour 90 personnes. Tout était prêt à l'heure, et délicieux.
          author: Sophie et Thomas R.
          role: Rezé
          rating: 5
  - faq:
      title: Questions fréquentes
      items:
        - q: Faites-vous du pain sans gluten ?
          a: Non, notre fournil travaille le blé et le seigle ; nous ne pouvons pas garantir l'absence de traces.
        - q: Peut-on réserver une pièce montée ?
          a: Oui, avec dix jours de préavis, par téléphone ou via le formulaire de contact.
        - q: Êtes-vous ouverts le lundi ?
          a: Non, la boulangerie est fermée le lundi. Ouvert du mardi au dimanche de 6 h 30 à 19 h 30.
  - cta:
      title: Ouvert du mardi au dimanche, de 6 h 30 à 19 h 30
      text: 8 rue de la Juiverie, 44000 Nantes. Pour une commande ou une question, appelez-nous ou écrivez-nous.
      button: { label: Nous contacter, to: /contact }
      style: primary
