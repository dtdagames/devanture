page: contact
route: /contact
seo:
  title: Contact
  description: Contactez le cabinet Garnier & Associés, 25 cours de l'Intendance à Bordeaux. Tél 05 56 00 00 00.
sections:
  - contact.form:
      id: contact
      title: Prendre rendez-vous
      intro: Décrivez brièvement votre situation, nous vous recontactons pour fixer votre consultation de 30 minutes offerte.
      to: contact@garnier-associes.fr
      fields:
        - name
        - email
        - phone
        - { name: domaine, label: Domaine concerné, type: select, options: [Droit du travail, Droit des affaires, Droit de la famille] }
        - { name: ville, label: Lieu souhaité, type: select, options: [Bordeaux, Libourne, Arcachon] }
        - message
      success: Merci, nous revenons vers vous rapidement.
