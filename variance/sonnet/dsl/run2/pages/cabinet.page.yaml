      text: |
        Le cabinet Garnier & Associés réunit trois avocats associés, deux collaboratrices et une assistante.

        Nous intervenons à Bordeaux, Libourne et Arcachon, auprès de particuliers, de salariés, d'entreprises et de dirigeants.
