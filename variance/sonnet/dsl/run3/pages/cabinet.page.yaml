  - richtext:
      title: Notre histoire
      image: cabinet.svg
      text: |
        Le cabinet Garnier & Associés a été fondé en 2011 à Bordeaux, cours de l'Intendance. Il réunit aujourd'hui trois avocats associés, deux collaboratrices et une assistante.

        Notre conviction : un client bien informé est un client mieux défendu. Nous expliquons chaque étape de la procédure et les coûts associés.
