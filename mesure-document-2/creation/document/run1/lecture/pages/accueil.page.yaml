# Lecture de ce document par sitec : le YAML que ce document vaut.
# Ne modifiez pas ce fichier : corrigez le document, relisez « sitec lire <dossier> », puis acceptez (« --accepter »).
route: /
seo:
  title: Cabinet Garnier & Associés, avocats à Bordeaux
  description: Avocats en droit du travail, droit des affaires et droit de la famille à Bordeaux, Libourne et Arcachon.
sections:
  - hero:
      title: Des avocats à vos côtés à Bordeaux
      subtitle: "Droit du travail, droit des affaires, droit de la famille : première consultation de 30 minutes offerte."
      image: hero.svg
      cta:
        label: Prendre rendez-vous
        to: /contact
      secondary:
        label: Nos domaines
        to: /domaines
  - features:
      title: Trois domaines d'expertise
      columns: 3
      items:
        - icon: scale
          title: Droit du travail
          text: Me Hélène Garnier vous accompagne, salariés comme employeurs.
        - icon: euro
          title: Droit des affaires
          text: Me Thomas Ruiz conseille et défend les entreprises.
        - icon: users
          title: Droit de la famille
          text: Me Inès Kaddour vous soutient dans les moments importants.
  - stats:
      items:
        - value: "2011"
          label: année de fondation du cabinet
        - value: "3"
          label: associés
        - value: 30 minutes
          label: de première consultation offertes
  - richtext:
      title: Le cabinet
      text: |-
        Fondé en 2011 à Bordeaux, le cabinet Garnier & Associés réunit trois associés, deux collaboratrices et une assistante.

        Nous intervenons à Bordeaux, Libourne et Arcachon. Une convention d'honoraires est systématiquement établie.
      image: cabinet.svg
  - cta:
      title: Parlons de votre situation
      text: Votre première consultation de 30 minutes est offerte.
      button:
        label: Nous contacter
        to: /contact
