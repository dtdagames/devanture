# Lecture de ce document par sitec : le YAML que ce document vaut.
# Ne modifiez pas ce fichier : corrigez le document, relisez « sitec lire <dossier> », puis acceptez (« --accepter »).
route: /contact
seo:
  title: Contact
  description: "Contactez le cabinet Garnier & Associés à Bordeaux : première consultation de 30 minutes offerte."
sections:
  - hero:
      title: Contactez-nous
      subtitle: Écrivez-nous ou appelez le 05 56 00 00 00.
  - contact.form:
      title: Écrivez-nous
      to: contact@garnier-associes.fr
      fields:
        - name
        - email
        - phone
        - message
      success: Merci, votre message a bien été envoyé. Le cabinet vous répondra rapidement.
  - map:
      title: Nous trouver
      address: 25 cours de l'Intendance, 33000 Bordeaux
