# Lecture de ce document par sitec : le YAML que ce document vaut.
# Ne modifiez pas ce fichier : corrigez le document, relisez « sitec lire <dossier> », puis acceptez (« --accepter »).
route: /contact
seo:
  title: Contact
  description: "Écrivez-nous ou appelez le 05 56 00 00 00 : première consultation de 30 minutes offerte."
sections:
  - hero:
      title: Nous contacter
      subtitle: Cabinet Garnier & Associés, 25 cours de l'Intendance à Bordeaux.
  - contact.form:
      title: Écrivez-nous
      to: contact@garnier-associes.fr
      fields:
        - name
        - email
        - phone
        - message
      success: Merci, votre message est bien reçu. Nous revenons vers vous rapidement.
  - map:
      title: Nous trouver
      address: 25 cours de l'Intendance, 33000 Bordeaux
