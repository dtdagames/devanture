  - richtext:
      title: Un cabinet à taille humaine
      text: |-
        Fondé à Bordeaux en 2011, le cabinet Garnier & Associés réunit trois avocats associés, deux collaboratrices et une assistante.

        Nous intervenons à Bordeaux, Libourne et Arcachon. Chaque dossier fait l'objet d'une convention d'honoraires, pour que les conditions soient claires dès le départ.
      image: cabinet.svg
  - cta:
      title: Parlons de votre situation
      text: La première consultation de 30 minutes est offerte.
      button: { label: Nous contacter, to: /contact }
