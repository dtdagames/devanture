  description: "Cabinet d'avocats à Bordeaux : droit du travail, droit des affaires, droit de la famille. Première consultation de 30 minutes offerte."
sections:
  - hero:
      title: Avocats à Bordeaux, à vos côtés
      subtitle: Droit du travail, droit des affaires, droit de la famille. Première consultation de 30 minutes offerte.
