page: domaines
route: /domaines
seo:
  title: Domaines d'intervention
  description: "Droit du travail, droit des affaires et droit de la famille à Bordeaux, Libourne et Arcachon."
sections:
  - hero:
      title: Nos domaines d'intervention
      subtitle: Trois associés, trois spécialités.
  - features:
      items:
        - icon: users
          title: Droit du travail
          text: Me Hélène Garnier intervient en droit du travail. Elle vous conseille et vous défend à Bordeaux, Libourne et Arcachon.
        - icon: scale
          title: Droit des affaires
          text: Me Thomas Ruiz intervient en droit des affaires. Il accompagne les entreprises dans leurs projets et leurs litiges.
        - icon: home
          title: Droit de la famille
          text: Me Inès Kaddour intervient en droit de la famille. Elle vous accompagne avec écoute et rigueur.
  - steps:
      title: Comment se déroule un dossier
      items:
        - title: Premier rendez-vous
          text: Une consultation de 30 minutes offerte pour comprendre votre situation.
        - title: Convention d'honoraires
          text: Une convention d'honoraires est systématiquement signée avant toute démarche.
        - title: Traitement du dossier
          text: L'avocat en charge instruit votre dossier et agit en votre nom.
        - title: Suivi
          text: Vous restez informé de l'avancement de votre dossier.
  - faq:
      title: Questions fréquentes
      items:
        - q: La première consultation est-elle payante ?
          a: Non, la première consultation de 30 minutes est offerte.
        - q: Où intervenez-vous ?
          a: "Nous intervenons à Bordeaux, Libourne et Arcachon."
        - q: Quels sont vos domaines de compétence ?
          a: "Le droit du travail, le droit des affaires et le droit de la famille."
  - cta:
      title: Un dossier à nous confier ?
      button: { label: Prendre rendez-vous, to: /contact }
